# TLP configuration for Dell Precision 7560
# Tuned for battery efficiency without sacrificing performance.
# Install: sudo cp tlp.conf /etc/tlp.conf && sudo tlp bat

TLP_ENABLE=1
TLP_DEFAULT_MODE=BAT

# CPU governor: powersave on both — lets HWP/EPP handle frequency scaling
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Frequency limits: allow full range, EPP handles efficiency
CPU_SCALING_MIN_FREQ_ON_AC=0
CPU_SCALING_MAX_FREQ_ON_AC=4800000
CPU_SCALING_MIN_FREQ_ON_BAT=0
CPU_SCALING_MAX_FREQ_ON_BAT=4800000

# Energy Performance Preference
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Allow full CPU performance and boost — EPP handles power draw
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1

# Scheduler power saving
SCHED_POWERSAVE_ON_AC=0
SCHED_POWERSAVE_ON_BAT=1

# Platform profile
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=power

# Auto-disable bluetooth on battery when no device is connected
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth"
