# /etc/tlp.d/00-ubuntu-fixes.conf — installed by ubuntu-fixes/fixes/tlp-battery
# Generic battery tuning for intel_pstate / amd-pstate laptops (HWP/EPP).
# Machine-specific overrides go in a later drop-in, e.g. /etc/tlp.d/50-local.conf.
#
# Profiles (TLP 1.9+): _AC = performance, _BAT = balanced, _SAV = power-saver.

# Governor: powersave everywhere and let EPP decide (performance governor pins max clocks)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# Don't cap the CPU on balanced: capping makes apps sluggish, EPP handles efficiency
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100

# power-saver: no turbo, capped
CPU_MAX_PERF_ON_SAV=50
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_SAV=0

SCHED_POWERSAVE_ON_AC=0
SCHED_POWERSAVE_ON_BAT=1

# Platform profile: filled in by install.sh from /sys/firmware/acpi/platform_profile_choices
{{PLATFORM_PROFILE}}

# Charge thresholds: keep cells away from voltage extremes for longevity (50/80)
# Use `sudo tlp fullcharge` before a trip when you need 100%.
START_CHARGE_THRESH_BAT0=50
STOP_CHARGE_THRESH_BAT0=80

# Radios: bluetooth off on battery unless something is connected, back on with AC
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth"
DEVICES_TO_ENABLE_ON_AC="bluetooth"
